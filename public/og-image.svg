<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#30363d" stroke-width="1" opacity="0.25">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M0 560H1200"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="16" stroke="#30363d" stroke-width="2" fill="none"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="84" height="84" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <path d="M42 16L66 25V46C66 60.5 55.7 74.3 42 77.8C28.3 74.3 18 60.5 18 46V25L42 16Z" fill="#0d1117" stroke="#58a6ff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M22 46H30L36 34L42 58L49 41L54 46H62" stroke="#3fb950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Title -->
  <text x="210" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f0f6fc" letter-spacing="-0.02em">
    RepoPulse
  </text>
  <rect x="430" y="115" width="60" height="26" rx="13" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1"/>
  <text x="444" y="132" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#58a6ff">v1.2</text>

  <!-- Tagline -->
  <text x="100" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#accent-grad)" letter-spacing="-0.03em">
    Your Entire GitHub Portfolio’s Health,
  </text>
  <text x="100" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f0f6fc" letter-spacing="-0.03em">
    In a Single Pulse.
  </text>

  <text x="100" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8b949e" letter-spacing="-0.01em">
    Unified Executive Dashboard for Dependabot CVEs, CodeQL Security &amp; GitHub Pages Builds.
  </text>

  <!-- Feature Pill Cards -->
  <g transform="translate(100, 440)">
    <!-- Pill 1: Dependabot (Google Material Icon: local_fire_department vector) -->
    <rect x="0" y="0" width="280" height="90" rx="12" fill="#161b22" stroke="#da3633" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="36" cy="45" r="16" fill="#da3633" fill-opacity="0.15"/>
    <path transform="translate(25, 34) scale(0.9)" d="M12 23c-4.97 0-9-3.58-9-8 0-4.08 3.05-7.44 7-7.93v2.02C6.91 9.57 5 12.07 5 15c0 3.31 3.13 6 7 6s7-2.69 7-6c0-1.66-.57-3.19-1.53-4.32l1.45-1.45C20.17 10.74 21 12.78 21 15c0 4.42-4.03 8-9 8zm0-6c-1.66 0-3-1.34-3-3 0-1.07.56-2.01 1.41-2.55l1.59 2.12 1.59-2.12C14.44 11.99 15 12.93 15 14c0 1.66-1.34 3-3 3z" fill="#f85149"/>
    <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">Dependabot Triage</text>
    <text x="68" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Critical &amp; High CVE alerts</text>

    <!-- Pill 2: CodeQL (Google Material Icon: code vector) -->
    <rect x="310" y="0" width="280" height="90" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="346" cy="45" r="16" fill="#a371f7" fill-opacity="0.15"/>
    <path transform="translate(335, 34) scale(0.9)" d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" fill="#a371f7"/>
    <text x="378" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">CodeQL Static Analysis</text>
    <text x="378" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Security flaws &amp; CWEs</text>

    <!-- Pill 3: Pages (Google Material Icon: public vector) -->
    <rect x="620" y="0" width="280" height="90" rx="12" fill="#161b22" stroke="#238636" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="656" cy="45" r="16" fill="#238636" fill-opacity="0.15"/>
    <path transform="translate(645, 34) scale(0.9)" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="#3fb950"/>
    <text x="688" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">GitHub Pages Builds</text>
    <text x="688" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">CI/CD &amp; site uptime</text>
  </g>

  <!-- Glowing Pulse Waveform on Bottom Right -->
  <path d="M780 200H860L890 120L930 260L970 160L1000 200H1080" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" filter="url(#glow)"/>
</svg>