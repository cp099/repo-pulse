<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8">
    <title>RepoPulse - Page Not Found (404)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
      // Single Page App redirect for GitHub Pages
      // If accessing a deep path, redirect to base with hash/path
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0d1117;
        color: #f0f6fc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 40px;
        max-width: 480px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      }
      h1 { font-size: 48px; margin: 0 0 10px; color: #58a6ff; font-weight: 800; }
      p { color: #8b949e; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
      a {
        display: inline-block;
        background: #238636;
        color: #fff;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.2s;
      }
      a:hover { background: #2ea043; }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size: 48px; margin-bottom: 12px;">🛡️</div>
      <h1>404</h1>
      <p>The repository, security report, or dashboard view you requested could not be located on RepoPulse.</p>
      <a href="./">Return to Dashboard</a>
    </div>
  </body>
</html>
