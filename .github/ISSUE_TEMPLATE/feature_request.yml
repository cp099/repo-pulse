name: Feature Request
description: Suggest an idea or enhancement for RepoPulse
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make RepoPulse better? We would love to hear it.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: Describe the problem or current workflow...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe what you want to happen and how you envision it working.
      placeholder: Describe the solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Describe any alternative solutions or features you have considered.
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area of RepoPulse does this proposal target?
      options:
        - Executive Wallboard / TV Dashboard
        - Repositories Ledger & Filtering
        - Dependabot & Vulnerability Triage
        - CodeQL & Static Analysis
        - GitHub Pages & Build Monitoring
        - Authentication & Cloud Sync
        - General UI / UX
    validations:
      required: true
